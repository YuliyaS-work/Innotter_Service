services:
    db_ints:
      image: mysql:8.0
      container_name: mysql_innotter
      restart: always
      healthcheck:
        test: [ "CMD", "mysqladmin", "ping", "-h", "localhost" ]
        interval: 5s
        timeout: 5s
        retries: 10
      environment:
        - MYSQL_ROOT_PASSWORD=${DB_PASSWORD}
        - MYSQL_DATABASE=${DB_NAME}
        - MYSQL_USER=${DB_USER}
        - MYSQL_PASSWORD=${DB_PASSWORD}
      volumes:
        - mysql-data:/var/lib/mysql
      ports:
        - "3306:3306"



    ints_app:
      build: .
      command: >
        sh -c "
        python manage.py migrate &&
        python manage.py runserver 0.0.0.0:8002
        "
      environment:
        - DB_ENGINE=${DB_ENGINE}
        - DB_HOST=${DB_HOST}
        - DB_PORT=${DB_PORT}
        - DB_NAME=${DB_NAME}
        - DB_USER=${DB_USER}
        - DB_PASSWORD=${DB_PASSWORD}
        - SECRET_KEY=${SECRET_KEY}
      depends_on:
        db_ints:
          condition: service_healthy
      ports:
        - "8002:8002"

volumes:
  mysql-data: